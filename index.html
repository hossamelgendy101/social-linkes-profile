<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Social links profile</title>
</head>
<body>
<main>
  <article class="profile-card">
    <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="profile-card__image">
    <div class="profile-card__header">
      <h1 class="profile-card__name">Jessica Randall</h1>
      <p class="profile-card__location">London, United Kingdom</p>          
    </div>
    <p class="profile-card__bio">"Front-end developer and avid reader."</p>            

    <nav aria-label="Social links">
      <ul class="profile-card__socials">
        <li ><a class="profile-card__social-link" href="https://github.com/">GitHub</a></li>
        <li ><a class="profile-card__social-link" href="https://www.frontendmentor.io/">Frontend Mentor</a></li>
        <li ><a class="profile-card__social-link" href="https://www.linkedin.com/">LinkedIn</a></li>
        <li ><a class="profile-card__social-link" href="https://x.com/">Twitter</a></li>
        <li ><a class="profile-card__social-link" href="https://www.instagram.com/">Instagram</a></li>
      </ul>
    </nav>
  </article>
</main>
</body>
</html>
